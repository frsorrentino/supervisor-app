<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morph Island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../app-tokens.css">
<link rel="stylesheet" href="island.css">
</head>
<body>
<span class="badge">Morph</span>

<div class="island" id="island" role="status" aria-live="polite">
  <div class="ic ic-idle" data-s="idle"></div>

  <div class="ic ic-timer" data-s="timer">
    <span class="lead">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.2 1.6M9.5 3h5"/></svg>
      Focus
    </span>
    <span class="num" id="timerText">04:59</span>
  </div>

  <div class="ic ic-upload" data-s="upload">
    <svg class="ring" viewBox="0 0 32 32"><circle class="bg" cx="16" cy="16" r="13"/><circle class="fg" id="ring" cx="16" cy="16" r="13"/></svg>
    <span class="tx"><b>Nuova risposta</b><span>scheda delle animazioni</span></span>
    <span class="num" id="pct">0%</span>
  </div>

  <div class="ic ic-call" data-s="call">
    <span class="av" data-av="3" aria-hidden="true"></span>
    <span class="tx"><b>claude-master</b><span>ti aspetta</span></span>
    <button class="cbtn no" id="decline" aria-label="Decline">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>
    </button>
    <button class="cbtn yes" id="accept" aria-label="Accept">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.3.2 2.5.57 3.6a1 1 0 0 1-.25 1z"/></svg>
    </button>
  </div>
</div>

<div class="controls" role="group" aria-label="Island state">
  <button class="ctl" data-go="idle">Ferma</button>
  <button class="ctl" data-go="timer">Ora</button>
  <button class="ctl" data-go="upload">Risposta</button>
  <button class="ctl" data-go="call">Domanda</button>
</div>

<script src="../shared/motion.js"></script>
<script src="island.js"></script>
</body>
</html>
