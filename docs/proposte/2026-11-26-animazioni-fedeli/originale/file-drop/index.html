<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>File Drop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="drop.css">
</head>
<body>
<span class="badge">Inputs · Upload</span>
<div class="zone" id="zone" role="button" tabindex="0" aria-label="Upload a file. Drop it here, or press Enter to choose one.">
  <div class="core" id="core">
    <i class="g" id="g"></i>
    <svg class="ring" id="ring" viewBox="0 0 72 72" fill="none" stroke-width="3" stroke-linecap="round"><circle class="trk" cx="36" cy="36" r="33"/><circle class="arc" id="arc" cx="36" cy="36" r="33"/></svg>
    <span class="ic" id="up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></span>
    <span class="ic pct" id="pct">0</span>
    <span class="ic ok" id="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path id="tick" d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
  </div>
  <div class="line t" id="t"><span>Drop your file here</span></div>
  <div class="line s" id="s"><span>PDF, PNG or MP4, up to 20 MB</span></div>
  <input type="file" id="pick" hidden tabindex="-1" aria-hidden="true">
</div>
<div class="file" id="file" aria-hidden="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
  <span id="fn">brief.pdf</span>
</div>
<script src="../shared/motion.js"></script>
<script src="drop.js"></script>
</body>
</html>
