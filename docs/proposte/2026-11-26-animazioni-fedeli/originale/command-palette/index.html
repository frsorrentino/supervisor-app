<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Command Palette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="cmdk.css">
</head>
<body>
<span class="badge">Navigation · Command</span>
<div class="pal" id="pal">
  <button class="trig" id="trig" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><span class="ph">Search</span><kbd>⌘K</kbd></button>
  <div class="box" id="box">
    <div class="q"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><input id="q" placeholder="Type a command" autocomplete="off" spellcheck="false" aria-label="Command"></div>
    <ul class="res" id="res"><span class="hl" id="hl"></span></ul>
  </div>
</div>
<script src="../shared/motion.js"></script>
<script src="cmdk.js"></script>
</body>
</html>
