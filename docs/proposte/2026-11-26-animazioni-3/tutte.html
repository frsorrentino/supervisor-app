  .msgs { min-height: 150px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; }

&lt;div class=&quot;top&quot;&gt;&lt;h1&gt;Citare una sessione con @&lt;/h1&gt;&lt;div class=&quot;ref&quot;&gt;Mention picker&lt;br&gt;telefono · web&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;
  &lt;div class=&quot;msgs&quot;&gt;&lt;div class=&quot;cl&quot;&gt;La build è verde. Vuoi che chieda a supervisor-app di preparare la pre-release?&lt;/div&gt;&lt;/div&gt;

&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Cosa fa.&lt;/b&gt; Nel campo della master o di una sessione, «@» apre l&#x27;elenco delle sessioni, che si filtra mentre scrivi; la scelta diventa una pillola. Mandato, il testo va alla sessione citata come un prompt dal telefono (l&#x27;op c&#x27;è già); nella chat da cui scrivi resta una riga «→ supervisor-app». Il tocco sulla pillola apre la sessione. Con due citazioni il messaggio va a tutte e due.
&lt;div class=&quot;t&quot;&gt;elenco 150 ms + molla veloce · pillola con la molla di casa · ridotte: comparsa secca · relay: niente di nuovo, il prompt a una sessione c&#x27;è&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;/div&gt;
&lt;script&gt;// Ogni mockup ripete la sua scena: `M.loop(scena, fotogramma)` la fa partire, `?still` la ferma sul fotogramma del PNG,
// `?reduce` (o il riquadro) mostra la versione con le animazioni ridotte. Script classico: si apre anche da file://.
window.M = (() =&gt; {
  const q = new URLSearchParams(location.search)
  const still = q.has(&#x27;still&#x27;)
  const root = document.documentElement
  if (still) root.classList.add(&#x27;still&#x27;)
  if (q.has(&#x27;reduce&#x27;) || matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches) root.classList.add(&#x27;reduce&#x27;)
  const reduced = () =&gt; root.classList.contains(&#x27;reduce&#x27;)
  const wait = ms =&gt; new Promise(r =&gt; setTimeout(r, ms))
  async function loop(scene, stillFrame, every = 900) {
    // Le misure delle parole valgono solo con i caratteri veri caricati.
    await document.fonts.ready
    if (still) { stillFrame(); return }
    const box = document.querySelector(&#x27;.ctl&#x27;)
    if (box) box.innerHTML = &#x27;&lt;button class=&quot;tonal&quot; id=&quot;again&quot;&gt;Riproduci&lt;/button&gt;&lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;red&quot;&#x27; + (reduced() ? &#x27; checked&#x27; : &#x27;&#x27;) + &#x27;&gt; Animazioni ridotte&lt;/label&gt;&#x27;
    document.getElementById(&#x27;red&#x27;)?.addEventListener(&#x27;change&#x27;, e =&gt; root.classList.toggle(&#x27;reduce&#x27;, e.target.checked))
    let run = 0
    const go = async () =&gt; { const me = ++run; while (me === run) { await scene(); await wait(every) } }
    document.getElementById(&#x27;again&#x27;)?.addEventListener(&#x27;click&#x27;, go)
    go()
  }
  return { still, reduced, wait, loop }
})()
&lt;/script&gt;
&lt;script&gt;
  const pick = document.getElementById(&#x27;pick&#x27;), txt = document.getElementById(&#x27;txt&#x27;), lab = document.getElementById(&#x27;lab&#x27;)
  const set = h =&gt; { txt.innerHTML = h + &#x27;&lt;span class=&quot;caret&quot;&gt;&lt;/span&gt;&#x27; }
  M.loop(async () =&gt; {
    pick.classList.remove(&#x27;on&#x27;); set(&#x27;&#x27;); lab.textContent = &#x27;&#x27;
    await M.wait(700); set(&#x27;@&#x27;); pick.classList.add(&#x27;on&#x27;); lab.textContent = &#x27;@ apre le sessioni&#x27;
    await M.wait(700); set(&#x27;@sup&#x27;); await M.wait(900)
    pick.classList.remove(&#x27;on&#x27;); set(&#x27;&lt;span class=&quot;pill&quot;&gt;@supervisor-app&lt;/span&gt;&#x27;); lab.textContent = &#x27;la scelta diventa una pillola&#x27;
    await M.wait(800); set(&#x27;&lt;span class=&quot;pill&quot;&gt;@supervisor-app&lt;/span&gt; prepara la pre-release&#x27;); await M.wait(1800)
  }, () =&gt; { pick.classList.add(&#x27;on&#x27;); set(&#x27;@sup&#x27;); lab.textContent = &#x27;@ apre le sessioni, la scelta diventa una pillola&#x27; })

&lt;script&gt;// Ogni mockup ripete la sua scena: `M.loop(scena, fotogramma)` la fa partire, `?still` la ferma sul fotogramma del PNG,
// `?reduce` (o il riquadro) mostra la versione con le animazioni ridotte. Script classico: si apre anche da file://.

  const q = new URLSearchParams(location.search)
  const still = q.has(&#x27;still&#x27;)
  const root = document.documentElement
  if (still) root.classList.add(&#x27;still&#x27;)
  if (q.has(&#x27;reduce&#x27;) || matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches) root.classList.add(&#x27;reduce&#x27;)
  const reduced = () =&gt; root.classList.contains(&#x27;reduce&#x27;)
  const wait = ms =&gt; new Promise(r =&gt; setTimeout(r, ms))
  async function loop(scene, stillFrame, every = 900) {
    // Le misure delle parole valgono solo con i caratteri veri caricati.
    await document.fonts.ready
    if (still) { stillFrame(); return }
    const box = document.querySelector(&#x27;.ctl&#x27;)
    if (box) box.innerHTML = &#x27;&lt;button class=&quot;tonal&quot; id=&quot;again&quot;&gt;Riproduci&lt;/button&gt;&lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;red&quot;&#x27; + (reduced() ? &#x27; checked&#x27; : &#x27;&#x27;) + &#x27;&gt; Animazioni ridotte&lt;/label&gt;&#x27;
    document.getElementById(&#x27;red&#x27;)?.addEventListener(&#x27;change&#x27;, e =&gt; root.classList.toggle(&#x27;reduce&#x27;, e.target.checked))
    let run = 0
    const go = async () =&gt; { const me = ++run; while (me === run) { await scene(); await wait(every) } }
    document.getElementById(&#x27;again&#x27;)?.addEventListener(&#x27;click&#x27;, go)
    go()
  }
  return { still, reduced, wait, loop }
})()
