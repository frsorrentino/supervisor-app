<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>provino stile master</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%;display:block}</style></head>
<body>
<iframe id="f" src="/"></iframe>
<script>
// Provini dello stile della master (Franz, 06/10 15:25). Solo per gli screenshot, non fa parte dell'app.
// Ogni variante parte da quella attuale (filo corallo) e la sostituisce.
const v = new URLSearchParams(location.search).get('v') || 'filo'
const RESET = `.dock{box-shadow:none !important}.dock .mono{color:var(--text2) !important}.dock .ib{color:var(--icon) !important}
.field.master{border-color:rgb(255 255 255/.25) !important}`
const CSS = {
  filo: '',
  bordo: RESET + `.dock{box-shadow:inset 0 0 0 1.5px #D97757 !important}.dock .mono{color:#D97757 !important}
.field.master{border-color:rgb(217 119 87/.75) !important}`,
  terracotta: RESET + `.dock{background:#2B1A14 !important}.dock .mono{color:#E2A58C !important}.dock .ib{background:rgb(217 119 87/.18) !important;color:#F2C1A8 !important}
.field.master{border-color:rgb(217 119 87/.5) !important;background:#1A100C !important}`,
  alba: RESET + `.dock{background:linear-gradient(180deg,rgb(217 119 87/.30),rgb(217 119 87/.04) 70%),var(--low) !important}.dock .mono{color:#F2C1A8 !important}.dock .ib{color:#F2C1A8 !important}
.field.master{border-color:rgb(217 119 87/.55) !important}`,
  sigillo: RESET + `.dock svg[role=img]{display:none !important}.dock::before{content:'✻';display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#D97757;color:#1A0F0A;font:700 18px/1 system-ui;flex:none}
.dock .mono{color:#E2A58C !important}`,
  // Il fondo della barra prosegue intorno al campo: la master è un blocco a sé (Franz, 06/10 17:50).
  blocco_terracotta: RESET + `.pane > .closed{background:#2B1A14 !important;box-shadow:inset 0 3px 0 #D97757}.dock{background:transparent !important}
.dock .mono{color:#E2A58C !important}.dock .ib{background:rgb(217 119 87/.18) !important;color:#F2C1A8 !important}
.field.master{border-color:rgb(217 119 87/.55) !important;background:#1A100C !important}`,
  blocco_brace: RESET + `.pane > .closed{background:linear-gradient(180deg,#3A2219,#22150F) !important}.dock{background:transparent !important}
.dock .mono{color:#F2C1A8 !important}.dock .ib{background:rgb(255 255 255/.08) !important;color:#F6D9CC !important}
.field.master{border-color:rgb(242 193 168/.45) !important;background:rgb(0 0 0/.35) !important}`,
  blocco_corallo: RESET + `.pane > .closed{background:#A65A41 !important}.dock{background:transparent !important;color:#FFF3EC}
.dock .mono{color:rgb(255 243 236/.8) !important}.dock .ib{background:rgb(0 0 0/.2) !important;color:#FFF3EC !important}
.field.master{border-color:rgb(255 243 236/.5) !important;background:rgb(0 0 0/.28) !important}.mquick p,.mquick .hint{color:rgb(255 243 236/.75) !important}`,
  asterisco: RESET + `.dock .mono::before{content:'✻ ';color:#D97757;font-weight:700}.dock .col > b::first-letter{}
.field.master{border-color:rgb(255 255 255/.25) !important}`,
}
document.getElementById('f').addEventListener('load', () => {
  const d = document.getElementById('f').contentDocument
  const go = () => {
    if (!d.querySelector('.dock')) return setTimeout(go, 200)
    const s = d.createElement('style'); s.textContent = CSS[v] ?? ''; d.head.appendChild(s)
    document.title = 'pronto'
  }
  go()
})
</script>
</body></html>
