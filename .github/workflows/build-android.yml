name: Build Android APKs
# Repo pubblico dal 15/09/2026 (storia ripulita); i secret di firma KEYSTORE_PASS, KEY_ALIAS, KEY_PASS e
# RELEASE_KEYSTORE_BASE64 vengono da watchface/release-keystore-credentials.txt e release.jks.

on:
  push:
    # Il ramo dell'app (app-ci-prerelease-auto-06-11, Franz 06/11 15:36: «automatizza build e pre-release»): a ogni push la
    # build e, se passa, la pre-release.
    branches: [main, master, feature/**, tab-emoji/**]
    paths: ['core/**', 'wear/**', 'mobile/**', 'ui-tokens/**', 'gradle/**', 'contract/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/build-android.yml']
  workflow_dispatch:
    inputs:
      record:
        description: "Registra gli snapshot Paparazzi (wear/src/test/snapshots) e li carica come artifact"
        type: boolean
        default: false

# Un solo run per ramo: un push e un avvio a mano a pochi secondi di distanza caricavano due APK da 47 MB (17/09: quota
# storage di Actions al 100 %). L'ultimo arrivato cancella il precedente; i run con record=true hanno un gruppo loro.
concurrency:
  group: build-${{ github.ref }}-${{ github.event.inputs.record == 'true' && 'record' || 'apk' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    outputs:
      signed: ${{ steps.names.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        # La versione mostrata conta i commit: con la copia superficiale sarebbe 0.2.1.
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # Il default di `packages` è «tools platform-tools», e «tools» è sparito dall'archivio dell'SDK il 14/09/2026 sera:
      # sdkmanager usciva con 1 («Failed to find package 'tools'»), sia con v3 sia con v4. Solo platform-tools; il resto
      # dell'SDK lo scarica Gradle.
      - uses: android-actions/setup-android@v4
        with: { packages: 'platform-tools' }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'core/build.gradle.kts', 'wear/build.gradle.kts', 'mobile/build.gradle.kts', 'ui-tokens/build.gradle.kts') }}
          restore-keys: gradle-
      # Il gradle.properties del progetto è tarato sulla VM da 6 GB (demone Kotlin a 1 GB): dal 29/10 la compilazione del
      # telefono ci finiva fuori memoria («GC overhead limit exceeded»). Il runner ha 16 GB; quello dell'utente vince.
      - name: Gradle memory for CI
        run: printf 'org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8\nkotlin.daemon.jvmargs=-Xmx4096m\n' >> ~/.gradle/gradle.properties
      - name: Unit tests
        # Il telefono ha due flavor dal 26/10: github (release e ADB, con l'aggiornamento interno) e play (bundle per Play).
        run: ./gradlew :core:testDebugUnitTest :mobile:testGithubDebugUnitTest :mobile:testPlayDebugUnitTest --console=plain
      - name: Screenshot tests (Paparazzi, verify)
        if: hashFiles('wear/src/test/snapshots/**') != '' && github.event.inputs.record != 'true'
        run: ./gradlew :wear:verifyPaparazziDebug --console=plain
      - name: Screenshot tests del telefono (Paparazzi, verify)
        if: hashFiles('mobile/src/test/snapshots/**') != '' && github.event.inputs.record != 'true'
        run: ./gradlew :mobile:verifyPaparazziGithubDebug --console=plain
      - name: Screenshot tests (Paparazzi, record)
        if: github.event.inputs.record == 'true'
        run: ./gradlew :wear:recordPaparazziDebug :mobile:recordPaparazziGithubDebug --console=plain
      - name: Upload snapshots
        if: github.event.inputs.record == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-snapshots
          path: |
            wear/src/test/snapshots
            mobile/src/test/snapshots
          retention-days: 30
      - name: Debug APKs
        run: ./gradlew :wear:assembleDebug :mobile:assembleGithubDebug --console=plain
      - name: Restore keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.jks
      - name: Release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        # Anche gli AAB per Play (26/09): stesso pacchetto, versionCode 21 telefono e 22 orologio (pacchetto it.pixelfarm.supervisor dal 27/10, app nuova in pixelfarm.it; prima com.francescosorrentino.cmaster).
        # L'APK del telefono è il flavor github (si aggiorna dalle release), l'AAB del telefono il flavor play (26/10).
        run: ./gradlew :wear:assembleRelease :mobile:assembleGithubRelease :wear:bundleRelease :mobile:bundlePlayRelease --console=plain -x lint -x test
      # I nomi di sempre nell'artifact: mobile-release.apk è l'asset che l'app installata cerca nelle release
      # (AppUpdate.ASSET) e che scaricano install-watch.sh e le pre-release; mobile-release.aab va a Play.
      - name: Telefono, nomi di sempre
        id: names
        run: |
          mkdir -p mobile/build/outputs/apk/debug mobile/build/outputs/apk/release mobile/build/outputs/bundle/release
          cp mobile/build/outputs/apk/github/debug/mobile-github-debug.apk mobile/build/outputs/apk/debug/mobile-debug.apk
          if [ -f mobile/build/outputs/apk/github/release/mobile-github-release.apk ]; then
            cp mobile/build/outputs/apk/github/release/mobile-github-release.apk mobile/build/outputs/apk/release/mobile-release.apk
            cp mobile/build/outputs/bundle/playRelease/mobile-play-release.aab mobile/build/outputs/bundle/release/mobile-release.aab
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cmwatch-apk
          path: |
            wear/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/release/*.apk
            mobile/build/outputs/apk/debug/*.apk
            mobile/build/outputs/apk/release/*.apk
            wear/build/outputs/bundle/release/*.aab
            mobile/build/outputs/bundle/release/*.aab
          # 47 MB a build: con 30 giorni la quota Actions (0,5 GB-mese) finiva in pochi giorni di push. L'APK si scarica subito.
          retention-days: 1

  # La pre-release da sola (app-ci-prerelease-auto-06-11): a ogni push sul ramo dell'app, se la build è passata con l'APK firmato,
  # una pre-release sullo sha del push con mobile-release.apk, l'asset che l'app cerca (AppUpdate.ASSET) e che la Home propone come
  # la più recente (published_at). Tag univoco; nelle note i messaggi dei commit dall'ultima release. Una build fallita non
  # pubblica niente; un push nuovo annulla anche questo job (concurrency sopra).
  prerelease:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/tab-emoji/') && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: cmwatch-apk, path: apk }
      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(find apk -path '*mobile/build/outputs/apk/release/mobile-release.apk' | head -1)
          test -n "$apk"
          short=$(git rev-parse --short=8 "$GITHUB_SHA")
          tag="auto-$(date -u +%Y-%m-%d-%H%M)-$short"
          ver="0.2.$(git rev-list --count "$GITHUB_SHA")"
          prev=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || true)
          if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" >/dev/null; then range="$prev..$GITHUB_SHA"; else range="-n 10 $GITHUB_SHA"; fi
          git log --no-merges --format='- %s' $range | head -40 > notes.md
          [ -s notes.md ] || echo "- $(git log -1 --format=%s "$GITHUB_SHA")" > notes.md
          cp "$apk" mobile-release.apk
          gh release create "$tag" mobile-release.apk --prerelease --target "$GITHUB_SHA" --title "$ver · ${GITHUB_REF_NAME} · $short" --notes-file notes.md
